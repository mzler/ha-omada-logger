name: "Omada Diagnostic Advisor"
slug: "omada_diagnostic_advisor"
version: "1.3.0"
description: "Intelligente Überwachung von TP-Link Omada Netzwerken: Syslog-Analyse, Link-Drop-Erkennung, SQLite-Historie & HA-Push-Empfehlungen."
url: "https://github.com/mzler/ha-omada-logger"
arch:
  - aarch64
  - amd64
startup: "services"
boot: "auto"
init: false
ingress: true
ingress_port: 8099
homeassistant_api: true
ports:
  5514/udp: null
ports_description:
  5514/udp: "Omada Syslog UDP Port (Im Bereich 'Netzwerk' frei konfigurierbar, z.B. 5515 falls 5514 bereits belegt ist)"
options:
  omada_host: "192.168.1.1"
  omada_port: 8043
  omada_user: "admin"
  omada_password: ""
  omada_site: "Default"
  verify_ssl: false
  poll_interval_seconds: 60
  syslog_port: 5514
  notify_service: "none"
  notify_min_severity: "CRITICAL"
schema:
  omada_host: "str"
  omada_port: "port"
  omada_user: "str"
  omada_password: "password"
  omada_site: "str"
  verify_ssl: "bool"
  poll_interval_seconds: "int(10,3600)?"
  syslog_port: "port?"
  notify_service: "str"
  notify_min_severity: "list(CRITICAL|WARNING)"
